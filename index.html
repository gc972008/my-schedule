<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大學課程管理系統 - Schedule Dashboard</title>
  <style>
    /* ----------------------------------------------------
       1. 全域與深色主題變數設定 (Dark Theme Variables)
    ---------------------------------------------------- */
    :root {
      --bg-dark: #121212;
      --bg-card: #1e1e1e;
      --bg-sidebar: #181818;
      --border-color: #333333;
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --primary-accent: #007bff;
      --primary-hover: #0056b3;
      --success-accent: #28a745;
      --success-hover: #218838;
      --active-tab-bg: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ----------------------------------------------------
       2. 固定側邊導覽列樣式 (Sidebar)
    ---------------------------------------------------- */
    .sidebar {
      width: 220px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 20px 0;
      flex-shrink: 0;
    }

    .sidebar .brand {
      padding: 0 20px 20px 20px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffffff;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-tabs {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 0 10px;
    }

    .nav-item {
      padding: 12px 16px;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 15px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .nav-item.active {
      background-color: var(--active-tab-bg);
      color: #ffffff;
      font-weight: 600;
      border-left: 4px solid var(--primary-accent);
    }

    /* ----------------------------------------------------
       3. 主內容區域 Layout & Tab 面板控制（已修正防裁切）
    ---------------------------------------------------- */
    .main-content {
      flex-grow: 1;
      padding: 0; /* 移除容器 Padding，改由子頁面內裝控制 */
      overflow: hidden; /* 防止產生雙重捲軸 */
      background-color: var(--bg-dark);
      height: 100vh;
    }

    .tab-panel {
      display: none; /* 預設隱藏所有 Tab 面板 */
      width: 100%;
      height: 100vh;
      overflow-y: auto; /* 預設內容可滾動 */
      padding: 24px;
    }

    .tab-panel.active {
      display: block; /* 僅顯示當前啟動的 Tab 面板 */
    }

    /* 針對嵌入 iframe 的 Tab 頁面專屬修正 */
    #tab-schedule {
      padding: 0; /* 讓嵌入頁面無邊框滿版 */
      overflow: hidden;
    }

    /* 嵌入外部頁面 (如 timetable.html) 的 iframe 樣式 */
    .content-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ----------------------------------------------------
       4. 表單與區塊樣式
    ---------------------------------------------------- */
    .section {
      background: var(--bg-card);
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
    }

    h1, h2, h3 {
      margin-bottom: 15px;
      color: #ffffff;
    }

    label {
      color: var(--text-muted);
      font-size: 14px;
    }

    textarea, input, select {
      width: 100%;
      margin-top: 6px;
      margin-bottom: 14px;
      padding: 10px;
      box-sizing: border-box;
      background-color: #121212;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      font-size: 14px;
    }

    textarea:focus, input:focus, select:focus {
      outline: none;
      border-color: var(--primary-accent);
    }

    textarea {
      height: 90px;
      resize: vertical;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    button {
      background: var(--primary-accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      transition: background 0.2s;
    }

    button:hover { background: var(--primary-hover); }
    button.upload-btn { background: var(--success-accent); }
    button.upload-btn:hover { background: var(--success-hover); }

    #statusMsg {
      margin-top: 10px;
      font-weight: bold;
      color: #28a745;
    }

    .placeholder-box {
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
      border: 2px dashed var(--border-color);
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- 1. 側邊頁籤列 (固定於左側) -->
  <aside class="sidebar">
    <div class="brand">
      <span>📚</span> 課表管理系統
    </div>
    <ul class="nav-tabs">
      <li class="nav-item active" data-tab="tab-input">
        <span>✏️</span> 課程資料輸入
      </li>
      <li class="nav-item" data-tab="tab-schedule">
        <span>📅</span> 週課表檢視
      </li>
      <li class="nav-item" data-tab="tab-manage">
        <span>⚙️</span> 課程清單與修改
      </li>
    </ul>
  </aside>

  <!-- 2. 主要內容顯示區 -->
  <main class="main-content">

    <!-- 頁籤一：課程資料輸入 -->
    <section id="tab-input" class="tab-panel active">
      <div style="max-width: 1000px; margin: 0 auto;">
        <h1>📚 大學課程資訊解析</h1>

        <div class="section">
          <h3>1. 貼上課程基本資訊</h3>
          <textarea id="metaInput" placeholder="貼上包含學期、課號、課程名稱、教師等資訊"></textarea>

          <h3>2. 時間與評量補充資訊</h3>
          <div class="form-grid">
            <div>
              <label><strong>上課禮拜：</strong></label>
              <select id="dayOfWeekInput">
                <option value="星期一">星期一</option>
                <option value="星期二">星期二</option>
                <option value="星期三">星期三</option>
                <option value="星期四">星期四</option>
                <option value="星期五">星期五</option>
                <option value="星期六">星期六</option>
                <option value="星期日">星期日</option>
              </select>
            </div>
            <div>
              <label><strong>開始課堂 (節次/時間)：</strong></label>
              <input type="text" id="startClassInput" placeholder="例如：第 3 節 或 10:10">
            </div>
            <div>
              <label><strong>結束課堂 (節次/時間)：</strong></label>
              <input type="text" id="endClassInput" placeholder="例如：第 4 節 或 12:00">
            </div>
            <div>
              <label><strong>學習評量項目總計：</strong></label>
              <input type="text" id="assessmentInput" placeholder="例如：期中考30%、期末考40%、作業30%">
            </div>
          </div>

          <h3>3. 貼上每週課綱與考試資訊</h3>
          <textarea id="syllabusInput" placeholder="貼上包含第一週...、期中考、期末考等課綱資訊"></textarea>

          <button id="parseBtn">開始解析</button>
        </div>

        <div class="section">
          <h2>解析結果</h2>
          <h3>基本資訊：</h3>
          <div id="metaResult">尚未解析</div>
          <hr style="border-color: var(--border-color); margin: 15px 0;">
          <h3>週次課綱：</h3>
          <div id="syllabusResult">尚未解析</div>
          
          <hr style="border-color: var(--border-color); margin: 20px 0;">
          <button id="uploadBtn" class="upload-btn">直接同步到 Google 試算表</button>
          <div id="statusMsg"></div>
        </div>
      </div>
    </section>

    <!-- 頁籤二：週課表檢視 (無縫嵌入滿版 timetable.html) -->
    <section id="tab-schedule" class="tab-panel">
      <iframe src="timetable.html" class="content-frame"></iframe>
    </section>

    <!-- 頁籤三：課程清單與修改區 -->
    <section id="tab-manage" class="tab-panel">
      <div style="max-width: 1000px; margin: 0 auto;">
        <h1>⚙️ 已匯入課程與修改</h1>
        <div class="section placeholder-box">
          <h3>[Course Management 預留區]</h3>
          <p>此區塊提供線上編輯、修改已匯入課程資訊的功能。</p>
        </div>
      </div>
    </section>

  </main>

  <!-- 3. JavaScript 切換頁籤邏輯 -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const navItems = document.querySelectorAll('.nav-item');
      const tabPanels = document.querySelectorAll('.tab-panel');

      navItems.forEach(item => {
        item.addEventListener('click', () => {
          const targetTabId = item.getAttribute('data-tab');
          if (!targetTabId) return;

          // 移除所有 active 狀態
          navItems.forEach(nav => nav.classList.remove('active'));
          tabPanels.forEach(panel => panel.classList.remove('active'));

          // 切換選取的 Tab 與面板
          item.classList.add('active');
          const targetPanel = document.getElementById(targetTabId);
          if (targetPanel) {
            targetPanel.classList.add('active');
          }
        });
      });
    });
  </script>
  <script type="module" src="app.js"></script>
  <script src="googleSheetSync.js"></script>
<script src="courseModal.js"></script>
<script src="renderGrid.js"></script>
<script src="dayCountPicker.js"></script>
<script src="courseManage.js"></script>
<script src="courseEditModal.js"></script>

</body>
</html>
